# FastWAM 双臂全部任务联合训练：共享一个语言条件 policy，不逐任务分别训练。
# 通过 scripts/train_fastwam_group.py --experiment configs/experiments/fastwam_dual.yaml 启动。
# 任务、语言指令、数据路径与相机映射来自 configs/task_groups/dual_arm.yaml。
# 四卡 H100 80GB 起始配方；三相机比单臂两相机更占显存，需先在服务器短跑验证。
# 20000 步是首轮预算，并非已验证的最优收敛步数。

# 【配置格式 / config】
schema_version: 1
model: fastwam

# 【任务选择与 GPU 启动 / launch】
group: dual_arm                       # [任务组] 双臂：状态 46 维，动作 44 维，不使用 π0.5 padding。
tasks: null                           # [任务] 选择双臂组内全部 5 个任务；共享一个 policy。
gpus: "0,1,2,3"                       # [GPU] 默认四卡；服务器另四卡用命令行 --gpus 4,5,6,7。

# 【模型序列与图像】
action_horizon: 32                    # [动作] 每个样本包含 32 步动作。
video_stride: 4                       # [视频] 每 4 步采样一帧，共 9 帧。
control_hz: 30                        # [频率] 必须与所有所选任务的数据 fps 一致。
image_size: [224, 224]                # [图像] 每相机尺寸；base/wrist_left/wrist_right 拼为 224×672。
sampling: task_balanced               # [采样] 均衡各任务的样本数，避免长任务主导联合训练。

# 【训练与优化 / train】
batch_size: 32                        # [批次] 每张 GPU 的 batch
gradient_accumulation_steps: 1        # [累积] 1 × 4 卡 × batch_size = 有效全局
num_workers: 4                        # [数据] 每个训练进程的 CPU 加载 worker
max_steps: 20000                      # [预算] 所有任务共享的优化器更新总步数，不是每任务 20000 步。
learning_rate: 0.0001                 # [优化] 余弦衰减；训练器预热总更新步数的 5%。
weight_decay: 0.01
seed: 42

# 【GPU 精度与显存 / gpu】
mixed_precision: bf16
gradient_checkpointing: true          # [显存] 重计算联合 DiT 层；保持训练 denoise 编译关闭。

# 【日志与模型保存 / logging & checkpoint】
save_every: 1000                      # [保存] 每 1000 次优化器更新保存共享权重和完整训练状态。
log_every: 10
wandb_enabled: true                   # [日志] 启动前在 FastWAM 环境执行 wandb login。

# 【部署推理与闭环评测 / inference & eval】
execute_steps: 8                      # [执行] 预测 32 步，每次执行前 8 步再规划。
num_inference_steps: 10
sigma_shift: 1.0

# 【验证集 / validation：每任务独立留出，只计算 loss】
validation_ratio: 0.1                 # [划分] 每个任务留出 10% 完整 episodes，不参与训练统计。
validation_seed: 42
validation_interval: 1000
validation_batch_size: 1              # [批次] 每卡验证 batch，不进行梯度累积。
validation_max_batches: 50            # [预算] 每任务最多 50 个全局验证批次；不是完整验证集指标。
