# FastWAM 单臂单任务真实数据短跑：4 张 H100（按每卡 80GB 规划），ZeRO-1，无 CPU offload。
# 启动时显式选择 --experiment configs/experiments/fastwam_smoke.yaml；完整 FastWAM 全参训练。
# 用真实示范检查训练、留出 loss、保存与加载；不会自动恢复或检查参数差分，恢复需显式 --resume。
# 20 步结果仅用于检查链路，不能据此报告任务性能；正式训练使用 fastwam_single.yaml。
# 任务、相机、状态/动作维度来自 configs/task_groups/；其 model_action_dim 是 π0.5 专用字段。
# group/tasks/gpus 从本文件读取，命令行同名选项优先；独立 eval 参数见 docs/configuration_guide.md。

# 【配置格式 / config】
schema_version: 1
model: fastwam                         #使用 FastWAM 官方训练器及 DexJoCo 适配层。

# 【任务选择与 GPU 启动 / launch】
group: single_arm                      # [任务] 默认单臂；命令行 --group 可覆盖。
tasks: [water_plant]                   # [任务] 默认只训练浇水；改为其他任务列表或 null（整个任务组）。
gpus: "0,1,2,3"                        # [GPU] 4 个可见 GPU 编号，启动 4 个训练进程；--gpus 可覆盖。

# 【模型序列与图像】
action_horizon: 32                     # [模型/动作序列] 一次预测 32 步；须能被 video_stride 整除，商须为 4 的倍数。
video_stride: 4                        # [数据/视频采样] 每隔 4 个动作时间步取视频帧；当前共 1+32/4=9 帧。
control_hz: 30                         # [数据/控制频率] 动作采样频率（Hz），须匹配数据 fps 和环境控制频率。
image_size: [224, 224]                 # [数据/图像] 每个相机的目标 [高, 宽]，两者须为 16 的倍数。
sampling: task_balanced                # [数据/采样] 等长虚拟任务分区实现任务均衡；frame_uniform 按原始帧连接。

# 【训练与优化 / train】
batch_size: 1                          # [训练/批次] 每张 GPU 的 batch；与 π0.5 的全局 batch 定义不同。
gradient_accumulation_steps: 1         # [训练/梯度累积] 累积多少个微批次后更新；有效全局 batch=本地 batch×卡数×累积次数。
num_workers: 0                         # [数据/CPU] 每个训练进程的数据加载工作进程数；0 表示本进程加载。
max_steps: 20                          # [训练/预算] 短跑更新 20 步；恢复第 10 步状态后仍以 20 步为结束目标。
learning_rate: 0.0001                  # [训练/优化] 目标学习率；当前继承余弦调度，官方训练器固定预热总步数的 5%。
weight_decay: 0.01                     # [训练/优化] 权重衰减系数。
seed: 42                               # [训练/随机性] 官方训练器的随机种子。

# 【GPU 精度与显存 / gpu】
mixed_precision: bf16                  # [GPU/精度] 混合精度：bf16、fp16 或字符串 "no"；不是所有权重的存储类型。
gradient_checkpointing: true           # [GPU/显存] 启用梯度检查点，以重算换取较少的激活显存。

# 【日志与模型保存 / logging & checkpoint】
save_every: 10                         # [保存/频率] 官方训练器保存权重/训练状态的更新步间隔。
log_every: 1                           # [日志/频率] 官方训练器记录指标的更新步间隔。
wandb_enabled: false                   # [日志/在线记录] 是否启用 W&B；训练控制台输出仍写入本地日志。

# 【部署推理与闭环评测 / inference & eval】
execute_steps: 8                       # [评测/执行] 每次预测后最多执行前 8 步再观察；eval --execute-steps 可覆盖。
num_inference_steps: 10                # [推理/采样] 策略服务调用 infer_action 的迭代步数，不是环境控制步数。
sigma_shift: 1.0                       # [推理/噪声调度] 动作采样时的 sigma 时间调度偏移参数，不是动作幅度倍数。

# 【验证集 / validation：只计算 loss，不参与训练】
validation_ratio: 0.1                  # [验证/划分] 每任务留出的完整 episode 比例；0 关闭，按数量向上取整且保留训练 episode。
validation_seed: 42                    # [验证/随机性] episode 划分及验证噪声的固定种子，两种模型使用相同值可复用划分。
validation_interval: 10                # [验证/频率] 每多少次优化器更新计算一次；最后一步也计算。
validation_batch_size: 1               # [验证/批次] 每张 GPU 的验证 batch，不进行梯度累积。
validation_max_batches: 2              # [验证/预算] 每任务最多 2 个全局验证批次（4 卡 × 每卡 1），结果标注是否全量。
