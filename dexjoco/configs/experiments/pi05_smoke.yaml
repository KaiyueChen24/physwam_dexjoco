# π0.5 单卡 H100 80GB 短跑：由 scripts/smoke_train_pi05.py 默认读取 pi05_smoke.yaml。
# 使用完整 π0.5 LoRA、真实任务组数据与 base 权重，验证更新、验证 loss、checkpoint 保存和恢复。
# 启动示例：python scripts/smoke_train_pi05.py --group single_arm --run-name h100_single_smoke --gpus 0
# 使用真实 LeRobot 示范；正式长跑使用 h100_lora.yaml。

# 【配置格式 / config】
schema_version: 1                      # [配置格式] 配置结构版本，目前仅接受 1。
model: pi05                            # [模型] 完整 π0.5 LoRA 模型。

# 【模型 / model】
action_horizon: 30                     # [模型/动作序列] 每次预测 30 步动作，保持 DexJoCo baseline 设置。
max_token_len: 250                     # [模型/文本] 指令与离散状态的 token 总长度上限，不含图像 token。

# 【GPU 与并行 / gpu】
fsdp_devices: 1                        # [GPU/参数分片] 单卡不分片；用 --gpus 0 只暴露一张 H100 80GB。

# 【数据 / data】
sampling: task_balanced                # [数据/采样] 所选组各任务等概率；单臂六任务或双臂五任务共享一个模型。
dataset_root: null                     # [数据/路径] 使用任务组的数据根目录；可用 --dataset-root 指向服务器数据盘。
video_backend: pyav                    # [数据/视频] LeRobot 视频解码后端，检查真实图像加载链路。

# 【归一化统计 / normalization】
stats_samples: 512                     # [归一化/抽样] 从划分后的训练帧抽样估计统计；仅供短跑，正式训练使用更大样本数。
stats_batch_size: 256                  # [归一化/CPU 批次] 每次累计的低维帧数，不解码视频，不是 GPU 训练 batch。

# 【初始化权重 / initialization】
checkpoint_paths:                      # [初始化/路径] 按 --group 选择；相对路径以 DexJoCo 仓库根目录为准。
  single_arm: checkpoints/pi05_base/params                # [初始化/单臂] 从 32 维 base 权重开始，而非 water_plant 专家权重。
  dual_arm: checkpoints/pi05_base_action_dim_44/params    # [初始化/双臂] 从扩展到 44 维动作头的 base 权重开始。

# 【训练与优化 / train】
seed: 42                               # [训练/随机性] 模型、任务采样与归一化统计的随机种子。
batch_size: 1                          # [训练/批次] 全局 batch=1；单卡首轮先验证完整模型链路。
num_workers: 0                         # [数据/CPU] 主进程加载，便于定位真实数据读取错误；不是 GPU 数。
num_train_steps: 20                    # [训练/预算] smoke 先更新 20 步，保存恢复后再更新 1 步。
learning_rate: 5.0e-05                  # [训练/优化] 预热后的学习率；当前实现预热后保持此值。
warmup_steps: 2                        # [训练/预热] 短跑前 2 步预热，避免沿用正式训练的 10000 步预热。

# 【日志与模型保存 / logging & checkpoint】
wandb_enabled: false                   # [日志/在线记录] 关闭 W&B 上传，仍保存 train.log 和 smoke_result.json。
log_interval: 1                        # [日志/频率] 每步记录；专用 smoke 脚本固定每步打印。
save_interval: 10                      # [保存/频率] 通用 train_group 入口每 10 步保存；专用 smoke 在恢复前后保存。
keep_period: null                      # [保存/保留] 不额外保留周期点；专用 smoke 使用其固定恢复验证策略。

# 【验证集 / validation：只计算 loss，不参与训练】
validation_ratio: 0.1                  # [验证/划分] 每任务留出约 10% 完整 episode；至少各保留一条训练和验证示范。
validation_seed: 42                    # [验证/随机性] 固定 episode 划分、验证帧子集和验证噪声。
validation_interval: 10                # [验证/频率] 第 10、20 次更新后验证；恢复后额外的第 21 步只检查训练继续。
validation_batch_size: 1               # [验证/GPU] 全局验证 batch=1，与单卡训练 batch 一致。
validation_max_batches: 2              # [验证/预算] 每任务最多验证 2 批，先检查链路；正式训练改为 null 遍历全量。
