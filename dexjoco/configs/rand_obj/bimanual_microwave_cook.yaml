# 【闭环评测 / eval】环境配置；GPU、服务地址、episodes 和 seeds 由启动命令指定。
# rand_full 目录本身不会开启随机化；需使用对应入口的 --rand-full 或随机化配置。

# [评测/环境] 要创建的 DexJoCo 仿真任务标识。
env_name: bimanual_microwave_cook
# [评测/相机] 左侧为策略输入键，右侧为仿真环境相机名称。
camera_mapping:
  # [评测/相机] 主视角映射。
  base: ego
  # [评测/相机] 左腕视角映射。
  wrist_left: wrist_left
  # [评测/相机] 右腕视角映射。
  wrist_right: wrist_right
# [评测/任务指令] 每次观测携带的语言指令；内容保留原始英文。
prompt: "Open the microwave door, place the food inside the microwave, close the door, and press the start button."
# [评测/机器人] 决定使用单臂或双臂的状态/动作布局。
robot_type: dual_arm
