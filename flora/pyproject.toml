[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physwam-flora"
version = "0.1.0"
description = "DexJoCo adapters for NVIDIA's pinned FLORA inference examples"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
data = ["av>=16,<19", "numpy<3", "Pillow>=11,<13", "pyarrow>=17,<24"]

[project.scripts]
physwam-flora = "physwam_flora.cli:main"

[tool.setuptools]
packages = ["physwam_flora"]

[tool.setuptools.package-data]
physwam_flora = ["review.html"]
